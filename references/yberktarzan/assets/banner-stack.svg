<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="76" viewBox="0 0 1000 76">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#05080F"/>
      <stop offset="30%"  stop-color="#0B1220"/>
      <stop offset="70%"  stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#1F6FEB" stop-opacity=".75"/>
      <stop offset="50%"  stop-color="#58A6FF"/>
      <stop offset="70%"  stop-color="#1F6FEB" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="sideR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1F6FEB" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#8FD0FF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#1F6FEB" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: 'Segoe UI', Ubuntu, 'DejaVu Sans', Sans-Serif; font-weight: 700;
           font-size: 27px; letter-spacing: 8px; fill: #E9F2FF; }
      .sw { animation: sw 9s linear infinite; }
      @keyframes sw { 0% { transform: translateX(-380px) } 100% { transform: translateX(1380px) } }
    </style>
  </defs>

  <rect width="1000" height="76" fill="url(#bg)"/>
  <ellipse cx="500" cy="38" rx="340" ry="46" fill="url(#halo)"/>
  <rect class="sw" x="0" y="0" width="380" height="76" fill="url(#sweep)"/>

  <rect x="0" y="0"  width="1000" height="2" fill="url(#rule)"/>
  <rect x="0" y="74" width="1000" height="2" fill="url(#rule)"/>

  <rect x="80"  y="37" width="240" height="1" fill="url(#side)"/>
  <rect x="680" y="37" width="240" height="1" fill="url(#sideR)"/>
  <rect x="76"  y="30" width="2" height="16" fill="#58A6FF" opacity=".85"/>
  <rect x="922" y="30" width="2" height="16" fill="#58A6FF" opacity=".85"/>

  <text class="t" x="500" y="48" text-anchor="middle">TECH STACK</text>
</svg>
