<svg xmlns="http://www.w3.org/2000/svg" width="500" height="30" viewBox="0 0 500 30">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0B1220" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#1F6FEB" stop-opacity=".55"/>
      <stop offset="50%"  stop-color="#58A6FF"/>
      <stop offset="82%"  stop-color="#1F6FEB" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#8FD0FF" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .pulse { animation: pl 4.5s ease-in-out infinite; }
      @keyframes pl { 0%,100% { opacity: .25 } 50% { opacity: .9 } }
    </style>
  </defs>
  <rect x="0" y="13" width="500" height="4" rx="2" fill="url(#l)"/>
  <rect class="pulse" x="0" y="14" width="500" height="2" rx="1" fill="url(#g)"/>
  <circle cx="250" cy="15" r="3.5" fill="#8FD0FF"/>
</svg>
